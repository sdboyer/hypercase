name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: go.mod
            go-version-file: go.mod
          - go: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Archives are not text
        run: |
          # No checkout may rewrite an archive's line endings.
          git check-attr text -- testdata/x.txtar | grep -q 'text: unset'

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Tests change no tracked file
        run: git diff --exit-code && test -z "$(git status --porcelain)"
