name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go: go.mod
            go-version-file: go.mod
          - go: stable
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go-version-file }}
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Test
        run: go test ./...

      - name: Test the sheets toy
        working-directory: walkthrough/sheets
        run: go test ./...
